# Netlify: build the Vite app and serve it as a single-page app
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Send every route (/studio/rigid-box, /track/…) to index.html so React Router handles it
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
